name: "Dica da comunidade / Community tip"
description: "Uma dica sua que aparece no jogo, no fim da página / Your own tip, shown in game at the end of the page"
title: "[Dica] "
labels: ["dica"]
body:
  - type: markdown
    attributes:
      value: |
        As dicas aparecem no jogo como **Dicas da comunidade**, separadas do guia oficial, com o seu usuário do GitHub.
        Tips show in game as **Community tips**, apart from the official guide, with your GitHub user name.
  - type: input
    id: pagina
    attributes:
      label: "Página / Page"
      description: "Idioma/id da página. O botão do jogo já preenche. Ex.: pt-BR/gps, en/skills, pt-BR/inicio"
      placeholder: "pt-BR/habilidades"
    validations:
      required: true
  - type: textarea
    id: dica
    attributes:
      label: "Dica / Tip"
      description: "Até 600 caracteres. Pode usar **negrito**. / Up to 600 characters. **Bold** works."
      placeholder: "Ex.: fica recarregando a arma sem parar que a habilidade Recarregar sobe."
    validations:
      required: true
