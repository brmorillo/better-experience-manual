name: Verificar manual

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o Pillow (desenha os diagramas)
        run: pip install "pillow>=10"
      - name: Converter o manual para o formato do jogo
        run: python tools/build_manual.py --check
      - name: Gerar o painel (so testa, nao grava na main)
        run: python tools/status.py
