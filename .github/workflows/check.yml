name: Check manual

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (draws the diagrams)
        run: pip install "pillow>=10"
      - name: Convert the manual to the game format
        run: python tools/build_manual.py --check
      - name: Build the status board (test only, does not write to main)
        run: python tools/status.py
