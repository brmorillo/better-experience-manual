name: Label Pull Request

# Adds labels (language, section, tip...) from the files the Pull Request changes.
# It does not check out or run the Pull Request's code: it only reads the file list.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false
