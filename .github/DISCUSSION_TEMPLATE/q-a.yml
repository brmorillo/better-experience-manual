title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Before asking, check the [FAQ](https://github.com/brmorillo/better-experience-manual/blob/main/docs/en/01-the-mod/08-faq.md). When someone solves it, mark the reply as the **Answer**.
        Antes de perguntar, veja as [Perguntas frequentes](https://github.com/brmorillo/better-experience-manual/blob/main/docs/pt-BR/01-o-mod/08-perguntas-frequentes.md). Quando alguém resolver, marque a resposta como **Answer**.
  - type: textarea
    id: question
    attributes:
      label: "Your question / Sua dúvida"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Mod and game version / Versão do mod e do jogo"
      placeholder: "e.g. mod 0.4.0, Build 42.12"
