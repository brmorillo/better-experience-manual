# Labels added to Pull Requests automatically, from the files that changed.
# Rótulos colocados sozinhos nos Pull Requests, pelos arquivos que mudaram.
en:
  - changed-files:
      - any-glob-to-any-file: ["docs/en/**", "tips/en/**", "templates/en/**"]
pt-BR:
  - changed-files:
      - any-glob-to-any-file: ["docs/pt-BR/**", "tips/pt-BR/**", "templates/pt-BR/**"]
manual:
  - changed-files:
      - any-glob-to-any-file: ["docs/**"]
tip:
  - changed-files:
      - any-glob-to-any-file: ["tips/**"]
diagram:
  - changed-files:
      - any-glob-to-any-file: ["tools/mermaid_png.py"]
tooling:
  - changed-files:
      - any-glob-to-any-file: ["tools/**", ".github/**", "manual.config.json"]
"section: the mod":
  - changed-files:
      - any-glob-to-any-file: ["docs/*/01-*/**"]
"section: skills":
  - changed-files:
      - any-glob-to-any-file: ["docs/*/02-*/**"]
"section: items":
  - changed-files:
      - any-glob-to-any-file: ["docs/*/03-*/**"]
"section: actions":
  - changed-files:
      - any-glob-to-any-file: ["docs/*/04-*/**"]
"section: character":
  - changed-files:
      - any-glob-to-any-file: ["docs/*/05-*/**"]
"section: world":
  - changed-files:
      - any-glob-to-any-file: ["docs/*/06-*/**"]
