# Rotulos do repositorio. Edite aqui: um robo cria ou atualiza no GitHub
# (.github/workflows/labels.yml). Rotulos que nao estao nesta lista nao sao apagados.
# Repository labels. Edit here: a bot creates or updates them on GitHub.
# Labels missing from this list are never deleted.

# Tipo / Type
- name: dica
  color: "0e8a16"
  description: "Dica da comunidade / Community tip"
- name: correção
  color: "d73a4a"
  description: "Algo errado ou confuso no manual / Something wrong or unclear"
- name: sugestão
  color: "a2eeef"
  description: "Ideia, página nova ou dúvida / Idea, new page or question"
- name: tradução
  color: "fbca04"
  description: "Falta no outro idioma / Missing in the other language"
- name: completar
  color: "c5def5"
  description: "Página com \"Ainda falta\" / Page still has \"Still missing\""
- name: manual
  color: "1d76db"
  description: "Conteúdo do manual (docs/) / Manual content"
- name: diagrama
  color: "bfd4f2"
  description: "Diagramas Mermaid / Mermaid diagrams"
- name: ferramentas
  color: "5319e7"
  description: "Scripts, robôs e verificação / Scripts, bots and checks"

