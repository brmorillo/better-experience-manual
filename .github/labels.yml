# Repository labels. Edit here and a bot creates or updates them on GitHub
# (.github/workflows/labels.yml). Labels missing from this list are never deleted.
# To rename a label, change `name` and keep the old name in `previous`:
# existing Issues and Pull Requests keep the label.
# Rótulos do repositório: edite aqui e o robô aplica no GitHub.

# Type / Tipo
- name: tip
  previous: dica
  color: "0e8a16"
  description: "Community tip / Dica da comunidade"
- name: fix
  previous: correção
  color: "d73a4a"
  description: "Something wrong or unclear / Algo errado ou confuso"
- name: suggestion
  previous: sugestão
  color: "a2eeef"
  description: "Idea, new page or question / Ideia, página nova ou dúvida"
- name: translation
  previous: tradução
  color: "fbca04"
  description: "Missing in the other language / Falta no outro idioma"
- name: incomplete
  previous: completar
  color: "c5def5"
  description: "Page still has \"Still missing\" / Página com \"Ainda falta\""
- name: manual
  color: "1d76db"
  description: "Manual content (docs/) / Conteúdo do manual"
- name: diagram
  previous: diagrama
  color: "bfd4f2"
  description: "Mermaid diagrams / Diagramas Mermaid"
- name: tooling
  previous: ferramentas
  color: "5319e7"
  description: "Scripts, bots and checks / Scripts, robôs e verificação"

# Language / Idioma
- name: en
  color: "3c3b6e"
  description: "English"
- name: pt-BR
  color: "009c3b"
  description: "Português"

# Manual section / Seção do manual
- name: "section: the mod"
  previous: "seção: o mod"
  color: "ededed"
  description: "The mod / O mod"
- name: "section: skills"
  previous: "seção: habilidades"
  color: "ededed"
  description: "Skills / Habilidades"
- name: "section: items"
  previous: "seção: itens"
  color: "ededed"
  description: "Items / Itens"
- name: "section: actions"
  previous: "seção: ações"
  color: "ededed"
  description: "Actions / Ações"
- name: "section: character"
  previous: "seção: personagem"
  color: "ededed"
  description: "Character / Personagem"
- name: "section: world"
  previous: "seção: mundo"
  color: "ededed"
  description: "World / Mundo"

# Progress / Andamento
- name: good first issue
  color: "7057ff"
  description: "Good for newcomers / Bom para começar"
- name: help wanted
  color: "008672"
  description: "Extra help welcome / Ajuda bem-vinda"
- name: needs in-game check
  previous: precisa conferir no jogo
  color: "f9d0c4"
  description: "Someone needs to check in Build 42 / Alguém precisa testar no Build 42"
- name: waiting for reply
  previous: aguardando resposta
  color: "fef2c0"
  description: "Waiting for the author / Esperando quem abriu responder"
- name: duplicate
  color: "cfd3d7"
  description: "Already exists / Já existe"
- name: wontfix
  color: "ffffff"
  description: "Will not be done / Não vai entrar"
